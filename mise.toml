# 開発環境の SSoT。`mise install` でツールを入れ、`mise run setup` で使える状態にする。
# 手順は docs/development/setup.md。

[tools]
# git hooks ランナー。`mise run setup` が .git/hooks へ導入する。
lefthook = "1.13.6"
# hikidashi 本体の言語（docs/development/architecture.md の「構成要素」）。
go = "1.27.1"
# Go の lint。設定は .golangci.yml。
golangci-lint = "2.13.2"

[tasks.setup]
description = "git hooks を導入し、開発を始められる状態にする"
run = ["lefthook install"]

[tasks.install]
description = "開発中の hikidashi を ~/.local/bin に入れる（hooks が PATH で呼ぶ版）"
# mise の GOBIN は Go を pin したディレクトリでしか PATH に入らず案件外の hooks から見えないため、~/.local/bin に入れる。
run = ['GOBIN="$HOME/.local/bin" go install ./cmd/hikidashi']

[tasks."lint:docs"]
description = "ドキュメントの書式契約を検査する"
# 書式の定義は docs/document_system/templates/。上限が無いと各変更の
# 「もう一言だけ足す」が複利で膨らむため、機械的に落とす。
# Python 3 標準ライブラリのみで動き、この検査自体は追加の依存を持たない。
run = ["python3 scripts/check-docs-format.py"]

[tasks."lint:go"]
description = "Go のコードを lint する（整形の崩れを含む）"
# 有効にする linter・formatter は .golangci.yml。
run = ["golangci-lint run ./..."]

[tasks.test]
description = "Go のテストを実行する"
run = ["go test ./..."]

[tasks.check]
description = "フルチェック（CI で docs/ 以外に変更がある PR に実行する）"
# 品質タスクを束ねる入口。テスト等を足したら depends に加える（CI 側は変えない）。
depends = ["lint:docs", "lint:go", "test"]
